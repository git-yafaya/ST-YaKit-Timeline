<script>
document.addEventListener('DOMContentLoaded', () => {
    // Prototype close behavior.
    const closeButton = document.getElementById('closeWindowButton');
    closeButton?.addEventListener('click', () => {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            document.body.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-[#0f172a] text-white font-body-base p-6">
                    <div class="text-center">
                        <div class="text-xl font-semibold mb-2">时间线管理已关闭</div>
                        <div class="text-sm opacity-70">这是静态原型中的关闭效果。</div>
                    </div>
                </div>`;
        }
    });

    // Prototype "get current time": updates the story-time display in-page only.
    document.querySelectorAll('.js-get-current-time').forEach(button => {
        button.addEventListener('click', () => {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const value = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            document.querySelectorAll('.js-story-time').forEach(el => el.textContent = value);

            const old = button.innerHTML;
            button.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span> 已更新`;
            button.disabled = true;
            setTimeout(() => {
                button.innerHTML = old;
                button.disabled = false;
            }, 1200);
        });
    });
});
</script>

      </div>
      <div id="providerContent"></div>`,
    settingsAuto: `
      <div class="pb-4 border-b border-outline-variant/10"><h3 class="font-headline-md text-headline-md font-semibold text-on-secondary">自动切换</h3><p class="font-body-sm text-body-sm text-on-secondary-container mt-1">配置时间解析与自动切换行为</p></div>
      <div class="py-5 border-b border-outline-variant/10"><label class="font-body-sm text-body-sm font-semibold text-on-secondary">大跨度时间跳跃阈值</label><div class="flex items-center gap-3 mt-2"><input id="jumpThreshold" type="number" value="365" class="w-32 px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-label-caps text-label-caps ${focusClasses}"><span class="font-body-sm text-body-sm text-on-secondary-container">天</span></div><p class="font-body-sm text-body-sm text-on-secondary-container mt-2">超过阈值的推导时间必须人工确认后才用于自动切换。</p></div>
      <div class="py-5"><button id="saveAutoSettings" class="px-4 py-2 rounded-lg bg-primary-container text-on-primary-container font-body-sm text-body-sm font-semibold">保存设置</button></div>`,
    settingsData: `
      <div class="pb-4 border-b border-outline-variant/10"><h3 class="font-headline-md text-headline-md font-semibold text-on-secondary">数据管理</h3><p class="font-body-sm text-body-sm text-on-secondary-container mt-1">导入与导出当前世界书的时间线配置</p></div>
      <div class="py-5 border-b border-outline-variant/10 flex flex-col sm:flex-row gap-3">
        <button id="exportConfig" class="px-4 py-2 rounded-lg border border-outline-variant/40 text-on-secondary font-body-sm text-body-sm hover:bg-white/[0.06]">导出 JSON</button>
        <button id="importConfig" class="px-4 py-2 rounded-lg border border-outline-variant/40 text-on-secondary font-body-sm text-body-sm hover:bg-white/[0.06]">导入 JSON</button>
        <input id="importFile" type="file" accept=".json,application/json" class="hidden">
      </div>
      <div class="py-5 rounded-lg"><div class="font-body-sm text-body-sm font-semibold text-on-secondary">安全规则</div><ul class="mt-2 space-y-1 font-body-sm text-body-sm text-on-secondary-container"><li>• API Key 不进入导出文件</li><li>• 导入后必须先校验 / 确认</li><li>• 导入不会立即取得时间线控制权</li></ul></div>`
  };

  const renderProvider = mode => {
    const host = document.getElementById('providerContent');
    if (!host) return;
    if (mode === 'st') {
      host.innerHTML = `
        <div class="py-5 border-b border-outline-variant/10 flex items-center justify-between gap-6"><div><div class="font-body-sm text-body-sm font-semibold text-on-secondary">当前状态</div><div class="flex items-center gap-2 mt-1"><span class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></span><span class="font-body-sm text-tertiary-fixed-dim">已连接</span></div></div><button id="testConnection" class="px-4 py-1.5 border border-outline-variant/50 hover:bg-surface-container-lowest/10 text-on-secondary rounded-lg font-label-caps text-label-caps">测试连接</button></div>
        <div class="py-5"><div class="font-body-sm text-body-sm font-semibold text-on-secondary mb-3">模型选择</div><select class="w-full bg-inverse-surface/50 border border-outline-variant/30 rounded-lg px-4 py-2 text-on-secondary font-body-sm ${focusClasses}"><option>使用 SillyTavern 当前模型</option></select></div>`;
    } else {
      host.innerHTML = `
        <div class="py-5 grid grid-cols-1 gap-4">
          <div><label class="font-label-caps text-label-caps text-on-secondary-container">API URL</label><input value="https://api.example.com/v1" class="mt-1 w-full px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-body-sm ${focusClasses}"></div>
          <div><label class="font-label-caps text-label-caps text-on-secondary-container">API Key</label><div class="relative"><input id="apiKeyInput" type="password" value="sk-example-key" class="mt-1 w-full px-3 py-2 pr-11 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-body-sm ${focusClasses}"><button id="toggleApiKey" class="absolute right-2 top-2.5 p-1 text-on-secondary-container"><span class="material-symbols-outlined text-[18px]">visibility</span></button></div></div>
          <div><label class="font-label-caps text-label-caps text-on-secondary-container">Model</label><input value="model-name" class="mt-1 w-full px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-body-sm ${focusClasses}"></div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div><label class="font-label-caps text-label-caps text-on-secondary-container">Temperature</label><input type="number" step="0.1" value="0.2" class="mt-1 w-full px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-label-caps ${focusClasses}"></div>
            <div><label class="font-label-caps text-label-caps text-on-secondary-container">Max Tokens</label><input type="number" value="4096" class="mt-1 w-full px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-label-caps ${focusClasses}"></div>
            <div><label class="font-label-caps text-label-caps text-on-secondary-container">Timeout</label><input type="number" value="60" class="mt-1 w-full px-3 py-2 rounded-lg border border-outline-variant/30 bg-white/[0.04] text-on-secondary font-label-caps ${focusClasses}"></div>
          </div>
          <button id="testConnection" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-outline-variant/40 text-on-secondary font-body-sm text-body-sm hover:bg-white/[0.06]">测试连接</button>
        </div>`;
    }
    document.getElementById('testConnection')?.addEventListener('click', () => showToast('连接测试成功（原型）'));
    document.getElementById('toggleApiKey')?.addEventListener('click', () => {
      const input = document.getElementById('apiKeyInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  };

  const wireDynamic = () => {
    document.querySelectorAll('.js-toggle').forEach(toggle => toggle.addEventListener('click', () => {
      const on = toggle.dataset.on !== 'false';
      toggle.dataset.on = String(!on);
      toggle.classList.toggle('bg-primary/30', !on);
      toggle.classList.toggle('bg-white/[0.05]', on);
      const knob = toggle.querySelector('span');
      knob.style.right = !on ? '0.25rem' : '';
      knob.style.left = on ? '0.25rem' : '';
      showToast(!on ? '通知已开启' : '通知已关闭');
    }));
    document.getElementById('saveAutoSettings')?.addEventListener('click', () => showToast('自动切换设置已保存（原型）'));
    document.getElementById('exportConfig')?.addEventListener('click', () => {
      const data = { worldbook:'Mushoku Tensei', exportedAt:new Date().toISOString(), note:'prototype export; API Key excluded' };
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='timeline-config.json'; a.click(); URL.revokeObjectURL(a.href);
      showToast('已导出配置 JSON');
    });
    document.getElementById('importConfig')?.addEventListener('click', () => document.getElementById('importFile')?.click());
    document.getElementById('importFile')?.addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { JSON.parse(reader.result); showToast('JSON 校验通过，等待人工确认（原型）'); }
        catch { showToast('JSON 格式无效'); }
      };
      reader.readAsText(file);
    });
  };

  const render = id => {
    active = id;
    detail.innerHTML = templates[id];
    tabs.forEach(tid => {
      const btn = document.getElementById(tid);
      if (!btn) return;
      const on = tid === id;
      btn.classList.toggle('border-primary-fixed-dim/30', on);
      btn.classList.toggle('bg-primary/10', on);
      btn.classList.toggle('border-transparent', !on);
    });
    if (id === 'settingsAI') {
      renderProvider('st');
      document.getElementById('providerST')?.addEventListener('click', () => { renderProvider('st'); showToast('已切换至 SillyTavern API'); });
      document.getElementById('providerIndependent')?.addEventListener('click', () => { renderProvider('independent'); showToast('已切换至独立 API'); });
    }
    wireDynamic();
  };

  tabs.forEach(id => document.getElementById(id)?.addEventListener('click', () => render(id)));
  render('settingsAI');
});
</script>

</body></html>
